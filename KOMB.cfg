#####################################################################
#
#   Do not edit this file. All user settings live in
#   _KOMB_Variables.cfg (copied to KOMB_Variables.cfg on install).
#
#   Macros defined here:
#     KOMB            - run a brushing sequence
#     KOMB_PURGE      - purge filament into a bucket (see KOMB_Purge.cfg)
#     KOMB_TRIGGER    - layer-change hook (see KOMB_Trigger.cfg)
#
#####################################################################

[include KOMB_Purge.cfg]
[include KOMB_Trigger.cfg]

[gcode_macro KOMB]
description: Clean the nozzle on a brush. All settings come from _KOMB_Variables and may be overridden per-call.
gcode:
    {% set vars = printer["gcode_macro _KOMB_Variables"] %}
    {% set th = printer.toolhead %}
    {% set ax_min, ax_max = th.axis_minimum, th.axis_maximum %}

    # ----------------------------------------------------------------
    # Parameters. Every setting can be overridden for a single call,
    # e.g.  KOMB REPEAT=3 SPEED=80
    # Booleans accept True/False, 1/0, yes/no and on/off in any case.
    # ----------------------------------------------------------------
    {% set truthy = ['1', 'true', 'yes', 'on'] %}

    {% set x_min          = params.BRUSH_LOCATION_X|default(vars.brush_location_x)|float %}
    {% set y_min          = params.BRUSH_LOCATION_Y|default(vars.brush_location_y)|float %}
    {% set z_max          = params.BRUSH_LOCATION_Z|default(vars.brush_location_z)|float %}
    {% set size_x         = params.BRUSH_SIZE_X|default(vars.brush_size_x)|float %}
    {% set size_y         = params.BRUSH_SIZE_Y|default(vars.brush_size_y)|float %}
    {% set size_z         = params.BRUSH_SIZE_Z|default(vars.brush_size_z)|float %}
    {% set offset         = params.OFFSET|default(vars.offset)|float %}
    {% set step           = params.STEP_SIZE|default(vars.step)|float %}
    {% set z_step         = params.Z_STEP_SIZE|default(vars.z_step)|float %}
    {% set z_hop_height   = params.Z_HOP_HEIGHT|default(vars.z_hop_height)|float %}
    {% set repeat         = params.REPEAT|default(vars.repeat)|int %}
    {% set speed          = params.SPEED|default(vars.speed)|float %}
    {% set speed_up       = params.SPEED_UP_BY|default(vars.speed_up)|float %}
    {% set travel_speed   = params.TRAVEL_SPEED|default(vars.travel_speed)|float %}
    {% set pattern        = params.PATTERN|default(vars.pattern)|int %}
    {% set angle          = params.ANGLE|default(vars.angle)|float %}
    {% set temp           = params.TEMPERATURE|default(vars.temp)|float %}
    {% set retract_before = params.RETRACT_BEFORE_WIPE|default(vars.retract_before_wipe)|float %}
    {% set retract_during = params.RETRACT_DURING_WIPE|default(vars.retract_during_wipe)|float %}
    {% set retract_after  = params.RETRACT_AFTER_WIPE|default(vars.retract_after_wipe)|float %}
    {% set purge          = params.PURGE_AMOUNT|default(vars.purge_amount)|float %}

    {% set reverse        = (params.ENABLE_REVERSE|default(vars.reverse_enable))|string|lower in truthy %}
    {% set opposite_side  = (params.START_OPPOSITE_SIDE|default(vars.start_opposite_side))|string|lower in truthy %}
    {% set adjacent_side  = (params.START_ADJACENT_SIDE|default(vars.start_adjacent_side))|string|lower in truthy %}
    {% set auto_home      = (params.ENABLE_AUTO_HOMING|default(vars.auto_home_enable))|string|lower in truthy %}
    {% set auto_heat      = (params.AUTO_HEAT_NOZZLE|default(vars.auto_heat_nozzle))|string|lower in truthy %}
    {% set cold_clean     = (params.CLEAN_WHILE_COLD|default(vars.clean_while_cold))|string|lower in truthy %}
    {% set return_to_start= (params.ENABLE_RETURN_TO_START|default(vars.return_to_start))|string|lower in truthy %}
    {% set verbose        = (params.ENABLE_VERBOSE_OUTPUT|default(vars.verbose_enable))|string|lower in truthy %}
    {% set verbose_points = (params.ENABLE_VERBOSE_POINTS|default(vars.verbose_points))|string|lower in truthy %}

    # ----------------------------------------------------------------
    # Validate the settings that would otherwise fail deep inside the
    # point generator with an unhelpful error.
    # ----------------------------------------------------------------
    {% if pattern not in [1, 2] %}
        { action_raise_error("KOMB: pattern must be 1 (diagonals) or 2 (circles), got '%s'." % pattern) }
    {% endif %}
    {% if step <= 0 %}
        { action_raise_error("KOMB: step must be greater than 0 (currently %s)." % step) }
    {% endif %}
    {% if size_x <= 0 and size_y <= 0 %}
        { action_raise_error("KOMB: brush_size_x and brush_size_y cannot both be 0 - the nozzle would have nowhere to move.") }
    {% endif %}
    {% if pattern == 2 and (size_x <= 0 or size_y <= 0) %}
        { action_raise_error("KOMB: pattern 2 (circles) needs a non-zero brush size on BOTH axes. Use pattern 1 for a single-axis brush.") }
    {% endif %}
    {% if angle < 0 or angle > 90 %}
        { action_raise_error("KOMB: angle must be between 0 and 90 degrees (currently %s)." % angle) }
    {% endif %}

    SAVE_GCODE_STATE NAME=komb_state

    # Retraction/purge amounts below are all relative distances, so force
    # relative extrusion. RESTORE_GCODE_STATE puts the original mode back.
    M83

    { action_respond_info(
        "<span class=primary--text>K</span>"
        ~ "<span class=error--text>O</span>"
        ~ "<span class=warning--text>M</span>"
        ~ "<span class=accent--text>B</span>"
        ~ "<span class=success--text>ing</span>"
        ~ "<span class=primary--text> Started</span>"
        ~ "<span class=secondary--text>!</span>") }

    # ----------------------------------------------------------------
    # Homing.
    #
    # Klipper renders this whole template before it executes a single
    # line of it, so printer.toolhead.position is whatever it was when
    # KOMB was called - a G28 emitted below does not update it. If we
    # have to home, the recorded position is meaningless, so the two
    # features that depend on it are switched off for this run.
    # ----------------------------------------------------------------
    {% set was_homed = 'xyz' in th.homed_axes %}

    {% if not was_homed %}
        {% if not auto_home %}
            { action_raise_error("KOMB: printer must be homed first (or set auto_home_enable: True).") }
        {% endif %}
        {% if x_min == 0 or y_min == 0 or z_max == 0 %}
            { action_raise_error("KOMB: a brush_location of 0 means 'use the current position', which is unknown until the printer is homed. Home first, or set explicit brush_location_x/y/z.") }
        {% endif %}
        {% if verbose %}
            { action_respond_info("KOMB: printer not homed - homing now. Return-to-start is disabled for this run.") }
        {% endif %}
        G28
    {% endif %}

    # (Jinja's `set` does not escape an if-block, so apply this outside.)
    {% set return_to_start = return_to_start and was_homed %}

    {% set start_x = th.position.x %}
    {% set start_y = th.position.y %}
    {% set start_z = th.position.z %}

    {% if verbose %}
        { action_respond_info("KOMB: starting position (%.2f, %.2f, %.2f)" % (start_x, start_y, start_z)) }
    {% endif %}

    # ----------------------------------------------------------------
    # Brush geometry.
    # A location of 0 means "use the current toolhead position on that
    # axis" - handy for gantry mounted brushes where only one axis
    # matters. Each axis is checked independently.
    # ----------------------------------------------------------------
    {% if x_min == 0 %}{% set x_min = start_x %}{% endif %}
    {% if y_min == 0 %}{% set y_min = start_y %}{% endif %}
    {% if z_max == 0 %}{% set z_max = start_z %}{% endif %}

    {% set x_max = x_min + size_x %}
    {% set y_max = y_min + size_y %}
    {% set z_min = z_max - size_z %}

    # Offset widens (or with a negative value, narrows) the sweep in XY.
    {% set x_min = x_min - offset %}
    {% set y_min = y_min - offset %}
    {% set x_max = x_max + offset %}
    {% set y_max = y_max + offset %}

    # Clamp everything into the printer's configured travel limits so a
    # mis-measured brush can never command an out-of-range move.
    {% set x_min = [[x_min, ax_min.x]|max, ax_max.x]|min %}
    {% set x_max = [[x_max, ax_min.x]|max, ax_max.x]|min %}
    {% set y_min = [[y_min, ax_min.y]|max, ax_max.y]|min %}
    {% set y_max = [[y_max, ax_min.y]|max, ax_max.y]|min %}
    {% set z_min = [[z_min, ax_min.z]|max, ax_max.z]|min %}
    {% set z_max = [[z_max, ax_min.z]|max, ax_max.z]|min %}

    # Recover the real usable size after clamping.
    {% set size_x = (x_max - x_min)|round(3) %}
    {% set size_y = (y_max - y_min)|round(3) %}
    {% set size_z = (z_max - z_min)|round(3) %}

    {% if verbose %}
        { action_respond_info("KOMB: brush X %.2f..%.2f  Y %.2f..%.2f  Z %.2f..%.2f  (%.1f x %.1f x %.1f mm)"
            % (x_min, x_max, y_min, y_max, z_min, z_max, size_x, size_y, size_z)) }
    {% endif %}

    # ----------------------------------------------------------------
    # Travel axis vs cross axis.
    #   adjacent_side = False -> sweep along X, zig-zag across Y
    #   adjacent_side = True  -> sweep along Y, zig-zag across X
    #   opposite_side = True  -> start at the far end and sweep back
    # ----------------------------------------------------------------
    {% set travel_span = size_y if adjacent_side else size_x %}
    {% set cross_span  = size_x if adjacent_side else size_y %}
    {% set dir = -1 if opposite_side else 1 %}

    {% if adjacent_side %}
        {% set travel_start = y_max if opposite_side else y_min %}
        {% set cross_start  = x_max if opposite_side else x_min %}
    {% else %}
        {% set travel_start = x_max if opposite_side else x_min %}
        {% set cross_start  = y_max if opposite_side else y_min %}
    {% endif %}

    # ----------------------------------------------------------------
    # sin/cos via Taylor series - Klipper's Jinja sandbox has no math
    # module. Accurate to ~1e-6 over the supported 0-90 degree range.
    # ----------------------------------------------------------------
    {% set a = angle * 3.14159265358979 / 180.0 %}
    {% set sin_a = a - a**3/6 + a**5/120 - a**7/5040 + a**9/362880 %}
    {% set cos_a = 1 - a**2/2 + a**4/24 - a**6/720 + a**8/40320 %}

    {% if verbose %}
        { action_respond_info("KOMB: pattern %d, angle %.1f deg (sin %.4f, cos %.4f), %d repeat(s)"
            % (pattern, angle, sin_a, cos_a, repeat)) }
        { action_respond_info("KOMB: retract before %.2f / during %.2f / after %.2f mm"
            % (retract_before, retract_during, retract_after)) }
    {% endif %}

    # ----------------------------------------------------------------
    # Point generation.
    # Each point is [x, y, z, i, j, retract, feedrate_mm_s]. i/j are the
    # arc-centre offsets and are only used by pattern 2.
    # ----------------------------------------------------------------
    {% set ns = namespace(points=[], z=z_max, feed=speed) %}

    {% if pattern == 1 %}
        # Diagonals: a zig-zag that crosses the full depth of the brush
        # on every stroke, so the whole bristle area gets used.
        #
        # `angle` sets how slanted each stroke is, which in turn sets how
        # far along the brush one crossing travels:
        #     advance = cross_span / tan(angle)
        #   45 deg -> advance equals the brush depth (a true 45 diagonal)
        #   steeper -> shorter advance, more strokes, denser scrubbing
        #    0 deg  -> no crossing at all, a plain straight wipe
        # `step` is the floor on that advance, so a very steep angle on a
        # deep brush still makes progress instead of scrubbing forever.
        {% if angle <= 0 %}
            {% set excursion = 0 %}
            {% set advance = step %}
        {% else %}
            {% set excursion = cross_span %}
            {% set tan_a = sin_a / cos_a if cos_a > 0.0001 else 100000 %}
            {% set advance = [cross_span / tan_a, step]|max %}
        {% endif %}
        # Never advance further than the brush is long.
        {% set advance = [advance, travel_span]|min if travel_span > 0 else advance %}
        {% set strokes = [((travel_span / advance)|round|int), 1]|max if advance > 0 else 1 %}

        {% if verbose %}
            { action_respond_info("KOMB: %d strokes, %.2f mm advance, %.2f mm excursion"
                % (strokes, advance, excursion)) }
        {% endif %}

        {% for r in range(repeat + 1) %}
            {% set outer = namespace(list=[]) %}
            {% for i in range(strokes + 1) %}
                {% set t = travel_start + dir * i * advance %}
                # Alternate the cross position on every stroke.
                {% set c = cross_start + dir * (excursion if i % 2 else 0) %}
                {% set px = c if adjacent_side else t %}
                {% set py = t if adjacent_side else c %}
                # Keep every stroke inside the brush itself, not merely
                # inside the machine's travel limits.
                {% set px = [[px, x_min]|max, x_max]|min %}
                {% set py = [[py, y_min]|max, y_max]|min %}
                {% set _ = outer.list.append([px, py, ns.z, 0, 0, 0, ns.feed]) %}
            {% endfor %}

            {% if reverse %}
                {% set back = outer.list[:-1] %}
                {% set _ = back.reverse() %}
                {% set _ = outer.list.extend(back) %}
            {% endif %}

            # Between passes only: step down, retract, and ramp the speed.
            {% if r < repeat %}
                {% set ns.z = [ns.z - z_step, z_min]|max %}
                {% set ns.feed = [ns.feed + speed_up, 1]|max %}
                {% set last = outer.list[-1] %}
                {% set _ = outer.list.append([last[0], last[1], ns.z, 0, 0, retract_during, ns.feed]) %}
            {% endif %}
            {% set _ = ns.points.extend(outer.list) %}
        {% endfor %}

    {% else %}
        # Circles: walk along the travel axis and scribe a full circle at
        # every step. Radius is half the short side so the circle always
        # fits inside the brush. Requires [gcode_arcs] to be enabled.
        {% set radius = ([size_x, size_y]|min) / 2 %}
        {% set cross_centre = (x_min + x_max) / 2 if adjacent_side else (y_min + y_max) / 2 %}
        {% set cross_edge = cross_centre - radius %}
        {% set strokes = [((travel_span / step)|round|int), 1]|max %}

        {% if verbose %}
            { action_respond_info("KOMB: %d circles of radius %.2f mm" % (strokes + 1, radius)) }
        {% endif %}

        {% for r in range(repeat + 1) %}
            {% set outer = namespace(list=[]) %}
            {% for i in range(strokes + 1) %}
                {% set t = travel_start + dir * i * step %}
                {% set px = cross_edge if adjacent_side else t %}
                {% set py = t if adjacent_side else cross_edge %}
                {% set px = [[px, x_min]|max, x_max]|min %}
                {% set py = [[py, y_min]|max, y_max]|min %}
                # Arc centre offset points from the nozzle to the middle
                # of the brush on the cross axis.
                {% set iv = radius if adjacent_side else 0 %}
                {% set jv = 0 if adjacent_side else radius %}
                {% set _ = outer.list.append([px, py, ns.z, iv, jv, 0, ns.feed]) %}
            {% endfor %}

            {% if reverse %}
                {% set back = outer.list[:-1] %}
                {% set _ = back.reverse() %}
                {% set _ = outer.list.extend(back) %}
            {% endif %}

            # Between passes only: step down, retract, and ramp the speed.
            {% if r < repeat %}
                {% set ns.z = [ns.z - z_step, z_min]|max %}
                {% set ns.feed = [ns.feed + speed_up, 1]|max %}
                {% set last = outer.list[-1] %}
                {% set _ = outer.list.append([last[0], last[1], ns.z, 0, 0, retract_during, ns.feed]) %}
            {% endif %}
            {% set _ = ns.points.extend(outer.list) %}
        {% endfor %}
    {% endif %}

    {% set points = ns.points %}
    {% if verbose %}
        { action_respond_info("KOMB: %d points generated" % points|length) }
    {% endif %}

    # ----------------------------------------------------------------
    # Temperature handling.
    # ----------------------------------------------------------------
    {% set hot = printer.extruder.temperature >= temp %}
    {% if not cold_clean and not hot %}
        {% if auto_heat %}
            {% if verbose %}{ action_respond_info("KOMB: heating nozzle to %d C" % temp) }{% endif %}
            SET_HEATER_TEMPERATURE HEATER=extruder TARGET={temp}
            TEMPERATURE_WAIT SENSOR=extruder MINIMUM={temp}
            {% set hot = True %}
        {% else %}
            { action_raise_error("KOMB: nozzle is below %d C. Heat it, or set clean_while_cold or auto_heat_nozzle to True." % temp) }
        {% endif %}
    {% endif %}

    # ----------------------------------------------------------------
    # Move to the brush and wipe.
    # ----------------------------------------------------------------
    {% if z_hop_height > 0 %}
        G91
        G0 Z{z_hop_height} F{travel_speed * 60}
        G90
    {% endif %}

    {% if purge > 0 %}
        KOMB_PURGE
    {% endif %}

    G0 X{points[0][0]|round(3)} Y{points[0][1]|round(3)} F{travel_speed * 60}
    G0 Z{points[0][2]|round(3)} F{travel_speed * 60}

    {% if hot and retract_before != 0 %}
        # NOTE: always negate with "* -1", never with a leading minus
        # right after the opening brace. Klipper's Jinja uses single
        # braces for expressions, so an open-brace followed by a minus is
        # read as a whitespace-strip marker and the minus is silently
        # swallowed - which turns a retraction into an extrusion.
        G1 E{retract_before * -1} F{1800}
    {% endif %}

    {% for point in points[1:] %}
        # Final safety clamp: no emitted move can leave the travel volume.
        {% set px = ([[point[0], ax_min.x]|max, ax_max.x]|min)|round(3) %}
        {% set py = ([[point[1], ax_min.y]|max, ax_max.y]|min)|round(3) %}
        {% set pz = ([[point[2], ax_min.z]|max, ax_max.z]|min)|round(3) %}
        {% set pe = point[5] if hot else 0 %}
        {% set pf = (point[6] * 60)|round(0)|int %}

        {% if pe != 0 %}
            G1 X{px} Y{py} Z{pz} E{pe * -1} F{pf}
        {% else %}
            G1 X{px} Y{py} Z{pz} F{pf}
        {% endif %}

        # A zero-radius arc is an error in Klipper, so only arc when the
        # centre offset is real (the closing point of each pass is not).
        {% if pattern == 2 and (point[3] != 0 or point[4] != 0) %}
            {% if opposite_side %}
                G3 I{point[3]|round(3)} J{point[4]|round(3)}
            {% else %}
                G2 I{point[3]|round(3)} J{point[4]|round(3)}
            {% endif %}
        {% endif %}

        {% if verbose_points %}
            { action_respond_info("KOMB: -> X%.2f Y%.2f Z%.2f E%.2f F%d" % (px, py, pz, -pe, pf)) }
        {% endif %}
    {% endfor %}

    {% if hot and retract_after != 0 %}
        G1 E{retract_after * -1} F{1800}
    {% endif %}

    # ----------------------------------------------------------------
    # Go home (to wherever we came from).
    # ----------------------------------------------------------------
    {% if return_to_start %}
        {% if z_hop_height > 0 %}
            G91
            G0 Z{z_hop_height} F{travel_speed * 60}
            G90
        {% endif %}
        G0 X{start_x|round(3)} Y{start_y|round(3)} F{travel_speed * 60}
        G0 Z{start_z|round(3)} F{travel_speed * 60}
        {% if verbose %}
            { action_respond_info("KOMB: returned to (%.2f, %.2f, %.2f)" % (start_x, start_y, start_z)) }
        {% endif %}
    {% endif %}

    {% if verbose %}
        { action_respond_info("KOMBing complete!") }
    {% endif %}

    RESTORE_GCODE_STATE NAME=komb_state
