# Simulated cartesian printer for exercising KOMB under real Klipper.
# 250 x 210 x 250 travel volume.

[mcu]
serial: /tmp/klipper_host_mcu

[printer]
kinematics: cartesian
max_velocity: 500
max_accel: 5000
max_z_velocity: 25
max_z_accel: 300

[stepper_x]
step_pin: gpio1
dir_pin: gpio2
enable_pin: !gpio3
microsteps: 16
rotation_distance: 40
endstop_pin: ^gpio4
position_endstop: 0
position_min: 0
position_max: 250
homing_speed: 50

[stepper_y]
step_pin: gpio5
dir_pin: gpio6
enable_pin: !gpio7
microsteps: 16
rotation_distance: 40
endstop_pin: ^gpio8
position_endstop: 0
position_min: 0
position_max: 210
homing_speed: 50

[stepper_z]
step_pin: gpio9
dir_pin: gpio10
enable_pin: !gpio11
microsteps: 16
rotation_distance: 8
endstop_pin: ^gpio12
position_endstop: 0
position_min: 0
position_max: 250
homing_speed: 10

[extruder]
step_pin: gpio13
dir_pin: gpio14
enable_pin: !gpio15
microsteps: 16
rotation_distance: 22.6789511
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: gpio16
sensor_type: EPCOS 100K B57560G104F
sensor_pin: analog0
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 500
# Batch mode never actually heats, so allow extrude moves at any
# temperature - otherwise every retraction would be rejected.
min_extrude_temp: 0

# Lets the test harness declare the axes homed without running a real
# homing move (no endstop can ever trigger in batch mode).
[force_move]
enable_force_move: True

[gcode_arcs]
resolution: 0.1

[include KOMB_Variables.cfg]

# Reports the true toolhead position so the harness can verify things
# like return-to-start against the motion system, not against the macro.
[gcode_macro REPORT_POS]
gcode:
    {% set p = printer.toolhead.position %}
    { action_respond_info("POS %.4f %.4f %.4f %.4f" % (p.x, p.y, p.z, p.e)) }

# Intercept the linear move commands so the harness sees the position
# Klipper's motion system actually arrived at after each move, rather
# than the coordinates the macro claims it emitted.
# REPORT_TRACE must be a separate command: a macro body is rendered in
# full before any of it executes, so an inline action_respond_info would
# report the position from *before* the move it is meant to follow.
[gcode_macro REPORT_TRACE]
gcode:
    {% set p = printer.toolhead.position %}
    { action_respond_info("TRACE %.4f %.4f %.4f %.4f" % (p.x, p.y, p.z, p.e)) }

[gcode_macro G0]
rename_existing: G0.9000
gcode:
    { action_respond_info("CMD G0 %s" % rawparams) }
    G0.9000 {rawparams}
    REPORT_TRACE

[gcode_macro G1]
rename_existing: G1.9000
gcode:
    { action_respond_info("CMD G1 %s" % rawparams) }
    G1.9000 {rawparams}
    REPORT_TRACE

[gcode_macro G2]
rename_existing: G2.9000
gcode:
    { action_respond_info("CMD G2 %s" % rawparams) }
    G2.9000 {rawparams}
    REPORT_TRACE

[gcode_macro G3]
rename_existing: G3.9000
gcode:
    { action_respond_info("CMD G3 %s" % rawparams) }
    G3.9000 {rawparams}
    REPORT_TRACE

[gcode_macro MARK]
gcode:
    { action_respond_info("MARK %s" % params.T) }
