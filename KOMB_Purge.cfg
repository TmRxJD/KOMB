#####################################################################
#   KOMB_PURGE - extrude a measured blob into a purge bucket
#
#   Part of KOMB (https://github.com/TmRxJD/KOMB), GPL-3.0-or-later.
#   See the LICENSE file at the root of this repository.
#
#   Included automatically by KOMB.cfg. Call it on its own with
#   KOMB_PURGE, or let KOMB call it by setting purge_amount > 0.
#####################################################################

[gcode_macro KOMB_PURGE]
description: Purge filament into the purge bucket. Settings come from _KOMB_Variables.
gcode:
    {% set vars = printer["gcode_macro _KOMB_Variables"] %}
    {% set th = printer.toolhead %}

    {% set truthy = ['1', 'true', 'yes', 'on'] %}
    {% set auto_home = (params.ENABLE_AUTO_HOMING|default(vars.auto_home_enable))|string|lower in truthy %}
    {% set auto_heat = (params.AUTO_HEAT_NOZZLE|default(vars.auto_heat_nozzle))|string|lower in truthy %}
    {% set verbose   = (params.ENABLE_VERBOSE_OUTPUT|default(vars.verbose_enable))|string|lower in truthy %}

    {% set amount = params.PURGE_AMOUNT|default(vars.purge_amount)|float %}
    {% set temp   = params.TEMPERATURE|default(vars.temp)|float %}
    {% set wait   = params.WAIT_TIME|default(vars.wait_time)|float %}
    {% set travel_speed = params.TRAVEL_SPEED|default(vars.travel_speed)|float %}
    # default() so that upgrading KOMB without also updating an existing
    # KOMB_Variables.cfg (which lives outside the repo) still works.
    {% set diameter = vars.filament_diameter|default(1.75)|float %}

    {% if amount <= 0 %}
        { action_raise_error("KOMB_PURGE: purge_amount must be greater than 0 (currently %s)." % amount) }
    {% endif %}
    {% if temp < 170 %}
        { action_raise_error("KOMB_PURGE: temp must be at least 170 C to extrude safely (currently %s)." % temp) }
    {% endif %}
    {% if diameter <= 0 %}
        { action_raise_error("KOMB_PURGE: filament_diameter must be greater than 0.") }
    {% endif %}

    # purge_speed is a volumetric flow rate in mm^3/s. Convert it to the
    # linear filament feedrate in mm/min that G1 F expects:
    #   mm/s = (mm^3/s) / cross-sectional area,  area = pi * (d/2)^2
    {% set area = 3.14159265358979 * (diameter / 2) ** 2 %}
    {% set purge_feedrate = ((vars.purge_speed|float / area) * 60)|round(0)|int %}

    {% if 'xyz' not in th.homed_axes %}
        {% if auto_home %}
            G28
        {% else %}
            { action_raise_error("KOMB_PURGE: printer must be homed first (or set auto_home_enable: True).") }
        {% endif %}
    {% endif %}

    SAVE_GCODE_STATE NAME=komb_purge_state
    M83

    {% if printer.extruder.temperature < temp %}
        {% if auto_heat %}
            {% if verbose %}{ action_respond_info("KOMB_PURGE: heating nozzle to %d C" % temp) }{% endif %}
            SET_HEATER_TEMPERATURE HEATER=extruder TARGET={temp}
            TEMPERATURE_WAIT SENSOR=extruder MINIMUM={temp}
        {% else %}
            { action_raise_error("KOMB_PURGE: nozzle must be at least %d C to purge. Heat it, or set auto_heat_nozzle: True." % temp) }
        {% endif %}
    {% endif %}

    {% if verbose %}
        { action_respond_info("KOMB_PURGE: purging %.1f mm of filament at %.1f mm3/s (F%d)"
            % (amount, vars.purge_speed|float, purge_feedrate)) }
    {% endif %}

    G0 X{vars.purge_location_x} Y{vars.purge_location_y} F{travel_speed * 60}
    G0 Z{vars.purge_location_z} F{travel_speed * 60}
    G1 E{amount} F{purge_feedrate}

    {% if wait > 0 %}
        G4 P{(wait * 1000)|round(0)|int}
    {% endif %}

    RESTORE_GCODE_STATE NAME=komb_purge_state
