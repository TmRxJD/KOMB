#   a Ko-fi here: https://ko-fi.com/tmrxjd
#####################################################################
#
#   HOW TO MEASURE YOUR BRUSH
#
#   1. Home the printer, then jog the nozzle to the BOTTOM-LEFT corner
#      of the brush. Those X/Y readings are brush_location_x/y.
#   2. Jog to the TOP-RIGHT corner. Subtract the first reading from the
#      second to get brush_size_x and brush_size_y.
#   3. Jog down until the nozzle just touches the top of the bristles.
#      That Z reading is brush_location_z.
#   4. brush_size_z is how much FURTHER down you are willing to let the
#      nozzle sink into the bristles. Start small (1-2 mm).
#
#   Always dry-run first: set brush_location_z a few mm high, run KOMB,
#   and watch the path in the air before letting it touch anything.
#
#   Every setting below can also be overridden for a single call, e.g.
#      KOMB REPEAT=3 SPEED=80 PATTERN=2
#
#####################################################################

# Loads the macros themselves. Leave this line alone.
[include ./KOMB/KOMB.cfg]

[gcode_macro _KOMB_Variables]
description: Settings storage for KOMB. Running it directly does nothing.

# --- Console output --------------------------------------------------------
variable_verbose_enable:        True    # Print a summary of what KOMB calculated and is about to do
variable_verbose_points:        False   # Print every single generated move. Very noisy - for debugging only

# --- Brush position and size -----------------------------------------------
# A location of 0 means "use wherever the nozzle already is on that axis",
# which is handy for gantry-mounted brushes. The printer must already be
# homed for that to work.
variable_brush_location_x:      100     # X of the brush's bottom-left corner, in mm
variable_brush_location_y:      100     # Y of the brush's bottom-left corner, in mm
variable_brush_location_z:      5       # Z at which the nozzle first touches the bristles, in mm
variable_brush_size_x:          20      # Brush width along X, in mm. 0 = no X movement (brush_size_y must then be > 0)
variable_brush_size_y:          5       # Brush depth along Y, in mm. 0 = no Y movement (brush_size_x must then be > 0)
variable_brush_size_z:          3       # How far below brush_location_z the nozzle may sink, in mm

# --- Pattern ---------------------------------------------------------------
variable_pattern:               1       # 1 = diagonals, 2 = circles (circles need [gcode_arcs] enabled)
variable_angle:                 45      # Pattern 1 only: how slanted each diagonal stroke is, 0-90 degrees.
                                        # Every stroke crosses the full depth of the brush; the angle
                                        # decides how far along the brush one crossing travels.
                                        #   0  = straight wipe, no crossing at all
                                        #   45 = a crossing advances by one brush depth (recommended)
                                        #   90 = advance only `step` per crossing, dense scrubbing
variable_step:                  1       # Pattern 2: distance between circles, in mm.
                                        # Pattern 1: minimum advance per crossing, in mm.
                                        # Must be greater than 0.
variable_start_opposite_side:   False   # Start at the far end and sweep back the other way
variable_start_adjacent_side:   False   # Sweep along Y instead of X
variable_reverse_enable:        False   # Retrace the pattern back to the start before the next repeat
variable_offset:                0       # Extend each stroke this many mm past the brush edge.
                                        # Negative keeps strokes further inside the brush.

# --- Repeats and depth -----------------------------------------------------
variable_repeat:                0       # Extra passes after the first one
variable_z_step:                0       # Lower the nozzle this many mm after each pass, down to
                                        # brush_location_z - brush_size_z. 0 = stay at one height

# --- Speeds ----------------------------------------------------------------
variable_speed:                 150     # Brushing speed, mm/s
variable_speed_up:              10      # Change brushing speed by this many mm/s each repeat (may be negative)
variable_travel_speed:          350     # Speed of the moves to and from the brush, mm/s

# --- Clearance -------------------------------------------------------------
variable_z_hop_height:          2       # Relative lift before travelling to or away from the brush, in mm.
                                        # 0 disables it; values below 2 are not recommended.
variable_return_to_start:       True    # Return to the pre-KOMB position afterwards.
                                        # Required for KOMB_TRIGGER (mid-print brushing).

# --- Homing and temperature ------------------------------------------------
variable_auto_home_enable:      True    # Home automatically if the printer isn't homed yet
variable_clean_while_cold:      True    # Allow brushing with a cold nozzle. False = require heat
variable_auto_heat_nozzle:      False   # If clean_while_cold is False, heat to `temp` automatically
variable_temp:                  170     # Minimum nozzle temperature for brushing, and the auto-heat target

# --- Retraction (only applied when the nozzle is at or above `temp`) --------
variable_retract_before_wipe:   1       # Retract this many mm before the first stroke. 0 = off
variable_retract_during_wipe:   0.5     # Retract this many mm between passes. 0 = off
variable_retract_after_wipe:    2       # Retract this many mm after the last stroke. 0 = off

# --- Purge (KOMB_PURGE) ----------------------------------------------------
variable_purge_amount:          0       # Filament to purge before brushing, in mm. 0 = no purge
variable_purge_location_x:      95      # X of the purge bucket, in mm
variable_purge_location_y:      100     # Y of the purge bucket, in mm
variable_purge_location_z:      5       # Z to purge at, in mm
variable_purge_speed:           20      # Purge flow rate, mm^3/s
variable_filament_diameter:     1.75    # Filament diameter, mm. Used to convert purge_speed to a feedrate
variable_wait_time:             5       # Seconds to wait after purging (lets ooze finish). 0 = don't wait

# --- Mid-print triggering (KOMB_TRIGGER) -----------------------------------
variable_trigger_freq:          0       # Brush every this many mm of print height. 0 = disabled.
                                        # Add KOMB_TRIGGER to your slicer's "after layer change" G-code
                                        # and KOMB_TRIGGER_RESET to your PRINT_START macro.
                                        # Not suitable for per-object printing. Use with care on
                                        # bed-mounted brushes on bed-slingers - check your clearances.

gcode:
    { action_respond_info("_KOMB_Variables only stores settings - running it does nothing. :)") }
