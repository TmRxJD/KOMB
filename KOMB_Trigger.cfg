#####################################################################
#   KOMB_TRIGGER - run KOMB every N mm of print height
#
#   Part of KOMB (https://github.com/TmRxJD/KOMB), GPL-3.0-or-later.
#   See the LICENSE file at the root of this repository.
#
#   Included automatically by KOMB.cfg.
#
#   Usage:
#     1. Set trigger_freq in _KOMB_Variables.cfg to the height in mm
#        between brushings (0 disables triggering entirely).
#     2. Add  KOMB_TRIGGER  to your slicer's "after layer change"
#        custom G-code.
#     3. Add  KOMB_TRIGGER_RESET  to your PRINT_START macro so each
#        print starts counting from zero.
#
#   return_to_start must be enabled, otherwise the toolhead will not
#   come back to where the print left off.
#####################################################################

[gcode_macro KOMB_TRIGGER]
description: Layer-change hook - runs KOMB every trigger_freq mm of height.
variable_next_trigger: 0.0
gcode:
    {% set vars = printer["gcode_macro _KOMB_Variables"] %}
    {% set freq = vars.trigger_freq|float %}

    {% if freq > 0 %}
        {% set height = printer.toolhead.position.z|float %}
        {% set next = printer["gcode_macro KOMB_TRIGGER"].next_trigger|float %}

        # A height well below the threshold we were waiting for means a
        # new print started without calling KOMB_TRIGGER_RESET.
        {% if height < next - freq %}
            {% set next = 0.0 %}
        {% endif %}

        {% if height >= next %}
            # Advance to the first multiple of freq above the current
            # height so a tall layer never queues up several brushings.
            {% set advanced = ((height / freq)|int + 1) * freq %}
            SET_GCODE_VARIABLE MACRO=KOMB_TRIGGER VARIABLE=next_trigger VALUE={advanced}
            {% if vars.verbose_enable %}
                { action_respond_info("KOMB_TRIGGER: brushing at Z%.2f, next at Z%.2f" % (height, advanced)) }
            {% endif %}
            KOMB
        {% endif %}
    {% endif %}

[gcode_macro KOMB_TRIGGER_RESET]
description: Reset the KOMB_TRIGGER height counter. Call this from PRINT_START.
gcode:
    SET_GCODE_VARIABLE MACRO=KOMB_TRIGGER VARIABLE=next_trigger VALUE=0.0
